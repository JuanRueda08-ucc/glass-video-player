<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Glass Video Player</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style>
    #video-container:fullscreen {
      width: 100vw;
      max-width: none;
      height: 100vh;
      padding: 20px;
      border: 0;
      border-radius: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    #video-container:fullscreen .video-stage {
      width: 100%;
      max-height: calc(100vh - 70px);
      border-radius: 0;
    }
  </style>
</head>

<body class="min-h-screen overflow-hidden bg-[#1b1815] text-white">

  <main class="relative flex min-h-screen items-center justify-center">

    <!-- Imagen de fondo -->
    <div
      class="absolute inset-0 scale-105 bg-cover bg-center"
      style="
        background-image: url('https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=1600&q=85');
      "
    ></div>

    <!-- Capa oscura -->
    <div class="absolute inset-0 bg-black/55"></div>

    <!-- Desenfoque ambiental -->
    <div class="absolute inset-0 backdrop-blur-[1.5px]"></div>

    <!-- Contenido -->
    <section class="relative z-10 w-full px-5">

      <!-- Menú lateral -->
      <nav
        aria-label="Menú principal"
        class="
        absolute left-1/2 top-1/2
        hidden -translate-x-[310px] -translate-y-1/2 -mt-10
          flex-col items-center gap-2
          rounded-full
          border border-white/15
          bg-[#514c46]/65
          px-2.5 py-4
          shadow-[0_20px_50px_rgba(0,0,0,0.45)]
          backdrop-blur-2xl
          md:flex
        "
      >

        <!-- Reproductor -->
        <button
          type="button"
          aria-label="Reproductor"
          class="
            grid size-10 place-items-center
            rounded-full
            border border-white/30
            bg-white/10
            text-white
            transition
            hover:bg-white/20
          "
        >
          <span
            class="
              grid size-6 place-items-center
              rounded-full
              border border-white/50
            "
          >
            <svg
              viewBox="0 0 24 24"
              class="ml-0.5 size-3"
              fill="currentColor"
            >
              <path d="M8 5v14l11-7z"></path>
            </svg>
          </span>
        </button>

        <!-- Biblioteca -->
        <button
          type="button"
          aria-label="Biblioteca"
          class="
            grid size-10 place-items-center
            rounded-full
            text-white/60
            transition
            hover:bg-white/10
            hover:text-white
          "
        >
          <svg
            viewBox="0 0 24 24"
            class="size-5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 8h12l1 11H5z"></path>
            <path d="M8 8V6a4 4 0 0 1 8 0v2"></path>
          </svg>
        </button>

        <!-- Transmisiones -->
        <button
          type="button"
          aria-label="Transmisiones"
          class="
            grid size-10 place-items-center
            rounded-full
            text-white/60
            transition
            hover:bg-white/10
            hover:text-white
          "
        >
          <svg
            viewBox="0 0 24 24"
            class="size-5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="1.5"></circle>
            <path d="M8.5 8.5a5 5 0 0 0 0 7"></path>
            <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
            <path d="M5.5 5.5a9 9 0 0 0 0 13"></path>
            <path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
          </svg>
        </button>

        <!-- Colecciones -->
        <button
          type="button"
          aria-label="Colecciones"
          class="
            grid size-10 place-items-center
            rounded-full
            text-white/60
            transition
            hover:bg-white/10
            hover:text-white
          "
        >
          <svg
            viewBox="0 0 24 24"
            class="size-5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="5" y="7" width="14" height="13" rx="2"></rect>
            <path d="M9 7V5a3 3 0 0 1 6 0v2"></path>
            <path d="M12 7v13"></path>
          </svg>
        </button>

        <!-- Buscar -->
        <button
          type="button"
          aria-label="Buscar"
          class="
            grid size-10 place-items-center
            rounded-full
            text-white/60
            transition
            hover:bg-white/10
            hover:text-white
          "
        >
          <svg
            viewBox="0 0 24 24"
            class="size-5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="6"></circle>
            <path d="m16 16 4 4"></path>
          </svg>
        </button>

      </nav>

      <!-- Marco principal -->
      <div
        id="video-container"
        class="
          mx-auto
          w-full max-w-[465px]
          rounded-[22px]
          border border-white/15
          bg-[#514c46]/75
          p-4
          shadow-[0_25px_70px_rgba(0,0,0,0.55)]
          backdrop-blur-2xl
        "
      >

        <!-- Encabezado -->
        <header class="mb-3 flex items-center justify-between">

          <!-- Regresar -->
          <button
            type="button"
            aria-label="Regresar"
            class="
              grid size-7 place-items-center
              rounded-full
              bg-white/10
              text-white/70
              transition
              hover:bg-white/20
              hover:text-white
            "
          >
            <svg
              viewBox="0 0 24 24"
              class="size-4"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m15 18-6-6 6-6"></path>
            </svg>
          </button>

          <!-- Título -->
          <h1 class="text-xs font-medium text-white/90">
            Flower Blooming
          </h1>

          <!-- Pantalla completa -->
          <button
            id="fullscreen-button"
            type="button"
            aria-label="Pantalla completa"
            class="
              grid size-7 place-items-center
              rounded-full
              text-white/70
              transition
              hover:bg-white/10
              hover:text-white
            "
          >
            <svg
              viewBox="0 0 24 24"
              class="size-4"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
              <path d="M16 3h3a2 2 0 0 1 2 2v3"></path>
              <path d="M8 21H5a2 2 0 0 1-2-2v-3"></path>
              <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
            </svg>
          </button>

        </header>

        <!-- Área del video -->
        <div
          class="
            video-stage
            group relative
            aspect-video
            overflow-hidden
            rounded-[13px]
            bg-black
          "
        >

          <video
            id="video"
            class="h-full w-full cursor-pointer object-cover"
            poster="https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=1000&q=85"
            preload="metadata"
            playsinline
          >
            <source
              src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
              type="video/mp4"
            >

            Su navegador no puede reproducir este video.
          </video>

          <!-- Sombra inferior -->
          <div
            class="
              pointer-events-none
              absolute inset-x-0 bottom-0
              h-24
              bg-gradient-to-t
              from-black/75
              to-transparent
            "
          ></div>

          <!-- Subtítulo -->
          <p
            id="subtitle"
            class="
              pointer-events-none
              absolute inset-x-0 bottom-8
              text-center
              text-[11px] font-medium
              text-white
              drop-shadow
            "
          >
            Flower
          </p>

          <!-- Barra de progreso -->
          <div class="absolute inset-x-4 bottom-3">

            <div
              id="progress-bar"
              role="slider"
              aria-label="Progreso del video"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
              tabindex="0"
              class="
                relative h-1
                cursor-pointer
                rounded-full
                bg-white/35
              "
            >

              <div
                id="progress-fill"
                class="
                  h-full w-0
                  rounded-full
                  bg-white
                "
              ></div>

              <span
                id="progress-dot"
                class="
                  absolute left-0 top-1/2
                  size-2.5
                  -translate-x-1/2
                  -translate-y-1/2
                  rounded-full
                  bg-white
                  shadow
                "
              ></span>

            </div>

          </div>

        </div>

      </div>

      <!-- Controles inferiores -->
      <nav
        aria-label="Controles del reproductor"
        class="
          mx-auto mt-4
          flex w-fit items-center gap-1
          rounded-full
          border border-white/15
          bg-[#625d56]/75
          px-4 py-2.5
          shadow-[0_15px_40px_rgba(0,0,0,0.4)]
          backdrop-blur-2xl
        "
      >

        <!-- Anterior -->
        <button
          type="button"
          aria-label="Video anterior"
          class="
            grid size-9 place-items-center
            rounded-full
            text-white/65
            transition
            hover:bg-white/10
            hover:text-white
          "
        >
          <svg
            viewBox="0 0 24 24"
            class="size-5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M19 20 9 12l10-8"></path>
            <path d="M5 19V5"></path>
          </svg>
        </button>

        <!-- Reproducir y pausar -->
        <button
          id="play-button"
          type="button"
          aria-label="Reproducir video"
          class="
            grid size-9 place-items-center
            rounded-full
            text-white/75
            transition
            hover:bg-white/15
            hover:text-white
          "
        >
          <svg
            viewBox="0 0 24 24"
            class="ml-0.5 size-5"
            fill="currentColor"
          >
            <path d="M8 5v14l11-7z"></path>
          </svg>
        </button>

        <!-- Siguiente -->
        <button
          type="button"
          aria-label="Video siguiente"
          class="
            grid size-9 place-items-center
            rounded-full
            text-white/65
            transition
            hover:bg-white/10
            hover:text-white
          "
        >
          <svg
            viewBox="0 0 24 24"
            class="size-5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m5 4 10 8-10 8"></path>
            <path d="M19 5v14"></path>
          </svg>
        </button>

        <!-- Separador -->
        <span class="mx-1 h-5 w-px bg-white/15"></span>

        <!-- Volumen -->
        <button
          id="volume-button"
          type="button"
          aria-label="Silenciar video"
          class="
            grid size-9 place-items-center
            rounded-full
            text-white/65
            transition
            hover:bg-white/10
            hover:text-white
          "
        >
          <svg
            viewBox="0 0 24 24"
            class="size-5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M11 5 6 9H2v6h4l5 4z"></path>
            <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
            <path d="M18 6a8.5 8.5 0 0 1 0 12"></path>
          </svg>
        </button>

        <!-- Subtítulos -->
        <button
          id="subtitle-button"
          type="button"
          aria-label="Activar o desactivar subtítulos"
          class="
            grid size-9 place-items-center
            rounded-full
            text-white/65
            transition
            hover:bg-white/10
            hover:text-white
          "
        >
          <svg
            viewBox="0 0 24 24"
            class="size-5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <path d="M7 10h4"></path>
            <path d="M7 14h3"></path>
            <path d="M13 14h4"></path>
          </svg>
        </button>

        <!-- Calidad -->
        <button
          type="button"
          aria-label="Calidad del video"
          class="
            rounded-full
            px-3 py-2
            text-xs font-medium
            text-white/65
            transition
            hover:bg-white/10
            hover:text-white
          "
        >
          1080p
        </button>

      </nav>

    </section>

  </main>

  <script>
    const video = document.getElementById("video");
    const playButton = document.getElementById("play-button");
    const volumeButton = document.getElementById("volume-button");
    const fullscreenButton = document.getElementById("fullscreen-button");
    const subtitleButton = document.getElementById("subtitle-button");
    const subtitle = document.getElementById("subtitle");
    const progressBar = document.getElementById("progress-bar");
    const progressFill = document.getElementById("progress-fill");
    const progressDot = document.getElementById("progress-dot");
    const videoContainer = document.getElementById("video-container");

    const playIcon = `
      <svg
        viewBox="0 0 24 24"
        class="ml-0.5 size-5"
        fill="currentColor"
      >
        <path d="M8 5v14l11-7z"></path>
      </svg>
    `;

    const pauseIcon = `
      <svg
        viewBox="0 0 24 24"
        class="size-5"
        fill="currentColor"
      >
        <path d="M7 5h4v14H7z"></path>
        <path d="M14 5h4v14h-4z"></path>
      </svg>
    `;

    function togglePlayback() {
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    }

    function updateProgress() {
      if (!video.duration) {
        return;
      }

      const percentage = (video.currentTime / video.duration) * 100;

      progressFill.style.width = `${percentage}%`;
      progressDot.style.left = `${percentage}%`;
      progressBar.setAttribute("aria-valuenow", Math.round(percentage));
    }

    function seekVideo(event) {
      if (!video.duration) {
        return;
      }

      const barPosition = progressBar.getBoundingClientRect();
      const clickPosition = event.clientX - barPosition.left;

      const percentage = Math.min(
        Math.max(clickPosition / barPosition.width, 0),
        1
      );

      video.currentTime = percentage * video.duration;
    }

    playButton.addEventListener("click", togglePlayback);
    video.addEventListener("click", togglePlayback);

    video.addEventListener("play", () => {
      playButton.innerHTML = pauseIcon;
      playButton.setAttribute("aria-label", "Pausar video");
    });

    video.addEventListener("pause", () => {
      playButton.innerHTML = playIcon;
      playButton.setAttribute("aria-label", "Reproducir video");
    });

    video.addEventListener("ended", () => {
      playButton.innerHTML = playIcon;
      playButton.setAttribute("aria-label", "Reproducir video");
    });

    video.addEventListener("timeupdate", updateProgress);

    progressBar.addEventListener("click", seekVideo);

    volumeButton.addEventListener("click", () => {
      video.muted = !video.muted;

      if (video.muted) {
        volumeButton.classList.add("bg-white/20", "text-white");
        volumeButton.classList.remove("text-white/65");
        volumeButton.setAttribute("aria-label", "Activar sonido");
      } else {
        volumeButton.classList.remove("bg-white/20", "text-white");
        volumeButton.classList.add("text-white/65");
        volumeButton.setAttribute("aria-label", "Silenciar video");
      }
    });

    subtitleButton.addEventListener("click", () => {
      const subtitlesHidden = subtitle.classList.toggle("hidden");

      if (subtitlesHidden) {
        subtitleButton.classList.remove("bg-white/20", "text-white");
        subtitleButton.classList.add("text-white/65");
      } else {
        subtitleButton.classList.add("bg-white/20", "text-white");
        subtitleButton.classList.remove("text-white/65");
      }
    });

    fullscreenButton.addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) {
          await videoContainer.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (error) {
        console.error(
          "No fue posible activar la pantalla completa:",
          error
        );
      }
    });

    document.addEventListener("keydown", (event) => {
      const activeElement = document.activeElement;
      const isButtonFocused = activeElement?.tagName === "BUTTON";

      if (event.code === "Space" && !isButtonFocused) {
        event.preventDefault();
        togglePlayback();
      }

      if (event.code === "ArrowRight") {
        video.currentTime = Math.min(
          video.currentTime + 5,
          video.duration || 0
        );
      }

      if (event.code === "ArrowLeft") {
        video.currentTime = Math.max(
          video.currentTime - 5,
          0
        );
      }
    });
  </script>

</body>
</html>
